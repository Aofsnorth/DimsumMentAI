version: "2"
run:
  go: "1.26"
  modules-download-mode: readonly
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - fmt.Print*
        - fmt.Fprint*
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - typeSwitchVar
        - ifElseChain
        - appendCombine
        - builtinShadowDecl
        - assignOp
        - sprintfQuotedString
      enabled-tags:
        - diagnostic
        - performance
    gosec:
      excludes:
        - G104   # unhandled errors (errcheck covers this)
        - G115   # integer overflow conversions; pervasive by design in the
                 # protocol layer (slots, coords) and guarded by callers
        - G404   # math/rand is intentional for jitter/animation, not crypto
      severity: medium
      confidence: medium
    govet:
      enable:
        - assign
        - shift
        - copylocks
        - printf
    misspell:
      locale: GB
    staticcheck:
      # QF*/ST* are style-refactor suggestions; the codebase intentionally
      # keeps its current shape. SA/S (bug & simplification) stay enabled.
      checks:
        - all
        - -QF*
        - -ST*

    prealloc:
      simple: true
      for-loops: true
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
        - name: unexported-return
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
          - gosec
          - prealloc
        path: .*_test\.go$
      - linters:
          - revive
        path: internal/bot/bot\.go
      - linters:
          - gocritic
        path: cmd/
    paths:
      - .*_gen\.go$
      - vendor
      - node_modules
      - web/visualizer/node_modules
      - web/visualizer/src
      - .kilo
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*_gen\.go$
      - vendor
      - node_modules
      - web/visualizer/node_modules
      - web/visualizer/src
      - .kilo
      - third_party$
      - builtin$
      - examples$
